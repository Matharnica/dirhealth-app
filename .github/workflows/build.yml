name: Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Test
        run: dotnet test src/DirHealth.Tests/DirHealth.Tests.csproj -c Release --verbosity normal

      - name: Publish
        run: |
          dotnet publish src/DirHealth.Desktop/DirHealth.Desktop.csproj `
            -c Release -r win-x64 --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:Version=${{ steps.version.outputs.version }} `
            -o ./publish

      - name: Build Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: installer/setup.iss
          options: /O+ /DAppVersion=${{ steps.version.outputs.version }}

      # Upload unsigned artifact — SignPath downloads it from here for signing
      - name: Upload artifact
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: DirHealth-Setup
          path: installer/Output/DirHealth-Setup-${{ steps.version.outputs.version }}.exe
          retention-days: 7

      # TODO: Add SignPath.io code signing once the Foundation account is approved.
      # Setup steps: https://signpath.io/open-source (requires MIT/Apache license + public repo)
      # Secrets needed: SIGNPATH_CI_TOKEN, SIGNPATH_ORG_ID

      - name: Compute installer checksum
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $file = "installer/Output/DirHealth-Setup-${{ steps.version.outputs.version }}.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          $hash | Out-File -FilePath "installer/Output/DirHealth-Setup-${{ steps.version.outputs.version }}.sha256" -Encoding ASCII -NoNewline

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: |
            installer/Output/DirHealth-Setup-${{ steps.version.outputs.version }}.exe
            installer/Output/DirHealth-Setup-${{ steps.version.outputs.version }}.sha256
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          prerelease: false
          draft: false
