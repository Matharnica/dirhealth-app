name: Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write  # required by SignPath

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Test
        run: dotnet test src/DirHealth.Tests/DirHealth.Tests.csproj -c Release --verbosity normal

      - name: Publish
        run: |
          dotnet publish src/DirHealth.Desktop/DirHealth.Desktop.csproj `
            -c Release -r win-x64 --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:Version=${{ steps.version.outputs.version }} `
            -o ./publish

      - name: Build Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
        with:
          path: installer/setup.iss
          options: /O+ /DAppVersion=${{ steps.version.outputs.version }}

      # Upload unsigned artifact — SignPath downloads it from here for signing
      - name: Upload artifact
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: DirHealth-Setup
          path: installer/Output/DirHealth-Setup-${{ steps.version.outputs.version }}.exe
          retention-days: 7

      # SignPath.io Foundation — free code signing for open source.
      # One-time setup at https://signpath.io/open-source:
      #   1. Register and apply for Foundation plan (free, requires public repo)
      #   2. Create project slug "dirhealth", signing policy "release-signing",
      #      artifact configuration "dirhealth-setup"
      #   3. Add this GitHub repo as a Trusted Build Source in SignPath
      #   4. Add to this repo:
      #        Secret:   SIGNPATH_CI_TOKEN   (API token from SignPath)
      #        Variable: SIGNPATH_ORG_ID     (Organization ID from SignPath)
      - name: Sign installer
        if: startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 15
        uses: signpath/github-actions-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_CI_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORG_ID }}'
          project-slug: 'dirhealth'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'dirhealth-setup'
          github-artifact-id: '${{ steps.upload-installer.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: installer/Output/signed

      - name: Verify signed artifact
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test -f "installer/Output/signed/DirHealth-Setup-${{ steps.version.outputs.version }}.exe" || \
            (echo "Signed artifact missing — signing may have failed" && exit 1)

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.3.2
        with:
          files: installer/Output/signed/DirHealth-Setup-${{ steps.version.outputs.version }}.exe
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          prerelease: false
          draft: false
