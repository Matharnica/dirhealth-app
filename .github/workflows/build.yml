name: Build & Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
    tags:
      - 'v*'

# Least privilege: read-only token by default. Only the `release` job (tag pushes) gets
# `contents: write`, so build, test and the third-party Inno Setup action never hold it.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Test
        run: dotnet test src/DirHealth.Tests/DirHealth.Tests.csproj -c Release --verbosity normal

      # Ab hier nur auf push/tags — auf PRs reicht der Test als Merge-Gate (spart den schweren Windows-Publish/Installer).
      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          dotnet publish src/DirHealth.Desktop/DirHealth.Desktop.csproj `
            -c Release -r win-x64 --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:Version=${{ steps.version.outputs.version }} `
            -o ./publish

      - name: Build Installer
        if: github.event_name != 'pull_request'
        uses: Minionguyjpro/Inno-Setup-Action@36e43b836ce2c78d21787b1f7183caf85c60ba05 # v1.3.0
        with:
          path: installer/setup.iss
          options: /O+ /DAppVersion=${{ steps.version.outputs.version }}

      # Upload unsigned artifact — SignPath downloads it from here for signing
      - name: Upload artifact
        id: upload-installer
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DirHealth-Setup
          path: installer/Output/DirHealth-Setup-${{ steps.version.outputs.version }}.exe
          retention-days: 7

      # TODO: Add SignPath.io code signing once the Foundation account is approved.
      # Setup steps: https://signpath.io/open-source (requires an OSI-approved license + public repo;
      # DirHealth is licensed under ELv2, so check eligibility first)
      # Secrets needed: SIGNPATH_CI_TOKEN, SIGNPATH_ORG_ID

  # Release only on version tags. Takes the installer that `build` built and uploaded,
  # and is the only job with write access to the repository.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: DirHealth-Setup
          path: installer/Output

      - name: Compute installer checksum
        shell: pwsh
        run: |
          $file = "installer/Output/DirHealth-Setup-${{ needs.build.outputs.version }}.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          $hash | Out-File -FilePath "installer/Output/DirHealth-Setup-${{ needs.build.outputs.version }}.sha256" -Encoding ASCII -NoNewline

      - name: Create Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: |
            installer/Output/DirHealth-Setup-${{ needs.build.outputs.version }}.exe
            installer/Output/DirHealth-Setup-${{ needs.build.outputs.version }}.sha256
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          prerelease: false
          draft: false
