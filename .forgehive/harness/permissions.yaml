description: >-
  Agent file access permissions. Edit to restrict which agents can touch which
  paths.
permissions:
  viktor:
    read:
      - '**'
    write:
      - src/
      - docs/
      - AGENTS.md
    deny:
      - .env
      - '*.key'
  kai:
    read:
      - src/**
      - test/**
    write:
      - src/
      - test/
    deny:
      - .env
      - '*.key'
      - '*.pem'
  sam:
    read:
      - src/**
      - test/**
    write:
      - test/
    deny:
      - .env
  vera:
    read:
      - '**'
    write:
      - .forgehive/security-report.md
    deny: []
  eli:
    read:
      - '**'
    write:
      - docs/
    deny:
      - .env
  nora:
    read:
      - '**'
    write: []
    deny:
      - .env
      - '*.key'
  suki:
    read:
      - src/**
      - docs/**
    write:
      - src/
      - docs/
    deny:
      - .env
